<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>'Create your account — Partage'</title>
<meta name="rating" content="RTA-5042-1996-1400-1577-RTA"/>
<link rel="canonical" href="https://www.partagetabitch.com/"/>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system,'Segoe UI','Helvetica Neue',sans-serif; background:#05010A; color:#f2eefc; line-height:1.5; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; }
  .logo { font-weight:800; font-size:20px; letter-spacing:.5px; margin-bottom: 30px; }
  .logo span { color:#00F5D4; }
  h1 { font-size: clamp(30px,6vw,44px); font-weight:800; letter-spacing:-.5px; margin-bottom: 10px; }
  .sub { color:#c9c4dd; margin-bottom: 28px; }
  label { display:block; font-size:14px; color:#818cf8; margin: 18px 0 6px; }
  input, textarea { width:100%; background:#0B0620; border:1.5px solid #2A1E4A; border-radius:12px; color:#f2eefc; padding:14px; font:inherit; }
  input:focus, textarea:focus { outline:none; border-color:#00F5D4; }
  .btn { display:inline-block; margin-top: 24px; background:linear-gradient(90deg,#FF2BD6,#00F5D4); color:#05010A; font-weight:800; font-size:16px; padding:14px 30px; border-radius:12px; text-decoration:none; border:none; cursor:pointer; }
  .card { background:#120014; border:1px solid #FF2BD6; border-radius:16px; padding:20px; margin: 20px 0; box-shadow:0 0 30px rgba(255,43,214,.2); }
  .steps { margin: 24px 0; }
  .steps div { padding: 12px 0; border-bottom:1px solid #2A1E4A; color:#c9c4dd; }
  .steps b { color:#FFD1F2; }
  .back { color:#818cf8; text-decoration:none; font-size:15px; }
  .legal { color:#8e8f9e; font-size:13px; margin-top: 26px; }
</style>
</head>
<body><div class="wrap">
<div class="logo">PARTAGE<span>.</span></div>

<h1>Create your account</h1>
<p class="sub">One account. Radar on when you're ready.</p>
<div class="card">
  <form onsubmit="event.preventDefault(); location.href="/verify";">
    <label>Email</label><input type="email" required placeholder="you@..." />
    <label>Password</label><input type="password" required minlength="8" />
    <label>I am a…</label>
    <select style="width:100%;background:#0B0620;border:1.5px solid #2A1E4A;border-radius:12px;color:#f2eefc;padding:14px;font:inherit" required>
      <option value="" disabled selected>Choose…</option>
      <option>Couple</option><option>Girl alone</option><option>Trans (TS/TV/CD/NB)</option><option>Single man (seeker)</option>
    </select>
    <button class="btn">Continue →</button>
  </form>
</div>
<p class="legal">By continuing you confirm you are 18+. Age verification is required before going on the radar.</p>
<p style="margin-top:20px"><a class="back" href="/partage">← Back</a></p>
</div></body></html>
